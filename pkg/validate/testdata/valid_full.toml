[defaults]
manager = "native"
method_order = ["native", "cargo", "go", "pip", "git", "http"]

[tools]
simple = ["zsh", "bat"]

fd = { apt = "fd-find" }
fzf = { go = "github.com/junegunn/fzf" }

[tools.ctpv]
  [tools.ctpv.git]
  url = "https://github.com/NikitaIvanovV/ctpv"
  build = "make && sudo make install"

[tools.fastfetch]
  [tools.fastfetch.http]
  url = "https://github.com/fastfetch-cli/fastfetch/releases/download/{latest}/fastfetch-linux-amd64.deb"
  checksum = "sha256:auto"

zathura-pdf-mupdf = { requires = ["zathura"], pacman = "zathura-pdf-mupdf" }
