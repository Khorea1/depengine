# Every method kind with all possible config keys
[tools]
a_native = { native = { pkg = "zsh" } }
b_native_overrides = { native = { pkg = "fd", pkg_overrides = { arch = "fd-find", debian = "fd-find" } } }

c_cargo = { cargo = { pkg = "bat" } }
d_cargo_git = { cargo = { git = "https://github.com/sharkdp/bat" } }

e_git = { git = { url = "https://github.com/user/repo.git", build = "make" } }
f_git_nobuild = { git = { url = "https://github.com/user/repo2.git" } }

g_http = { http = { url = "https://example.com/file.deb" } }
h_http_checksum = { http = { url = "https://example.com/file.tar.gz", checksum = "sha256:6ca13d52ca70c883e0f0bb101e425a89e8624de51db2d2392593af6a84118090" } }
i_http_extract = { http = { url = "https://example.com/archive.zip", extract_to = "/opt/app" } }
j_http_full = { http = { url = "https://example.com/pkg.tar.xz", checksum = "sha256:8f61ad5cfa0c471c8cbf810ea285cb1e5f9c2c5e5e5e4f58a3229667703e1587", extract_to = "/usr/local" } }

k_pip = { pip = { pkg = "requests" } }
l_pipx = { pipx = { pkg = "poetry" } }
m_uv = { uv = { pkg = "ruff" } }
n_npm = { npm = { pkg = "typescript" } }
o_yarn = { yarn = { pkg = "prettier" } }
p_gem = { gem = { pkg = "jekyll" } }
q_go = { go = { pkg = "github.com/user/tool" } }
r_aur = { aur = { pkg = "yay" } }

s_with_when = { when = { distro_family = ["debian"] }, apt = "vim" }

u_postinstall = { requires = ["a_native"], postinstall = "echo done", apt = "neovim" }

[v.postinstall]
requires = ["a_native"]
postinstall = "systemctl enable service"
native = { pkg = "nginx" }
