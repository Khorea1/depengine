schema_version = 1

# Edge case: valid schema with all legitimate features combined
[tools]
simple = ["zsh", "bat", "fd", "htop"]

[tools.neofetch]
apt = "neofetch"
pacman = "neofetch"
brew = "neofetch"
native = { pkg = "neofetch", pkg_overrides = { apt = "neofetch", pacman = "neofetch", brew = "neofetch" }, when = { distro_family = ["debian", "arch", "macos"] } }

[tools.starship]
requires = ["neofetch"]
post_install = "starship init bash >> ~/.bashrc"
cargo = { pkg = "starship", when = { distro_family = ["debian", "arch"] } }
npm = "starship"

# npm variant with macos: separate tool since TOML doesn't support
# duplicate section keys with different when clauses
[tools.starship_npm]
requires = ["neofetch"]
npm = { pkg = "starship", when = { distro_family = ["macos"] } }

[tools.lazygit]
requires = ["neofetch"]
go = "github.com/jesseduffield/lazygit"
git = { url = "https://github.com/jesseduffield/lazygit.git", build = "go install" }

[tools.fastfetch.http]
url = "https://github.com/fastfetch-cli/fastfetch/releases/download/2.0.0/fastfetch-linux-amd64.deb"
checksum = "sha256:e861b2eab679927cfa36fe256e9deb1969b0468ad0744d61064f9d188333aec6"
extract_to = "/tmp/fastfetch"

[tools.ripgrep]
cargo = { pkg = "ripgrep", when = { distro_family = ["debian", "arch", "fedora"] } }
pip = "ripgrep"
gem = "ripgrep"

[tools.zoxide]
requires = ["starship", "ripgrep"]
cargo = "zoxide"
post_install = "echo 'eval \"$(zoxide init bash)\"' >> ~/.bashrc"

[tools.bottom]
cargo = { pkg = "bottom", when = { distro_family = ["debian", "arch", "fedora", "suse"] } }
apt = "bottom"

[tools.doggo]
cargo = "doggo"
pip = "doggo"
apt = "doggo"
