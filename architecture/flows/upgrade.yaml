archmap: 2
doc: flow
id: upgrade
verified:
  revision: "62d052c"
  verified_on: "2026-10-06"
trigger: "Operator runs depengine upgrade to move tracked installations to versions already pinned in the lockfile."
steps:
  - from: operator
    to: cli
    action: "Invokes the upgrade command and selects schema, manifest, dry-run, filtering, and safety options."
    confidence: inferred
  - from: cli
    to: configuration
    action: "Loads the effective project once, including merged manifest, target facts, clan, provenance, and canonical schema path."
    evidence: ["internal/app/upgrade.go:461-480"]
    confidence: confirmed
  - from: cli
    to: state-and-lock
    action: "Loads lock and tracked state, attaches the v2 LockDocument when present, applies bounded v1 pins only on the legacy path, and discovers drift through the exact tracked candidate."
    evidence: ["internal/app/upgrade.go:487-525", "internal/app/upgrade.go:208-301"]
    symbols:
      - name: collectOutdatedTools
        path: internal/app/upgrade.go
        role: "Drift discovery and exact tracked-candidate selection."
    confidence: confirmed
  - from: cli
    to: reconciliation
    action: "Delegates each already-resolved target together with the discovery-time ToolState snapshot to ExecuteResolvedUpgradeCandidate; the CLI does not remove or reinstall the candidate itself."
    evidence: ["internal/app/upgrade.go:338-360", "internal/exec/resolved_candidate.go:14-48"]
    symbols:
      - name: ExecuteResolvedUpgradeCandidate
        path: internal/exec/resolved_candidate.go
        role: "Executor-owned upgrade boundary that preserves the exact resolved target and expected prior state."
    confidence: confirmed
  - from: reconciliation
    to: state-and-lock
    action: "Before destructive mutation, replacement execution records a durable replacement transaction containing prior tracked state, exact target identity, and resource claims."
    evidence: ["internal/exec/replacement.go:19-126", "internal/state/replacement.go:12-77"]
    symbols:
      - name: replaceCandidate
        path: internal/exec/replacement.go
        role: "Executor replacement state machine for remove/install/verify/commit."
      - name: BeginReplacement
        path: internal/state/replacement.go
        role: "Durable write-ahead boundary before removal."
    confidence: confirmed
  - from: reconciliation
    to: adapters
    action: "Removal and installation happen inside the replacement state machine through the exact adapter and resolved plan; normal candidate fallback is not re-entered."
    evidence: ["internal/exec/replacement.go:19-170", "internal/exec/resolved_candidate.go:14-48"]
    confidence: confirmed
  - from: reconciliation
    to: state-and-lock
    action: "Verified replacement state, resource ownership, and replacement-journal progress are persisted under the state lock; restart recovery observes old and desired identities before resuming."
    evidence: ["internal/state/replacement.go:117-260", "internal/exec/run.go:100-178"]
    confidence: confirmed
failure_modes:
  - "Missing or invalid lock data stops upgrade before replacement."
  - "Ambiguous or missing tracked-candidate identity becomes a discovery failure instead of selecting an arbitrary same-kind candidate."
  - "A stale discovery-time ToolState snapshot fails closed under the state lock before WAL creation or removal."
  - "Unknown, broken, conflicting, or ambiguous replacement recovery blocks rather than guessing whether removal or installation happened."
  - "An invalid or mismatched v2 universal projection fails closed before pinned replacement planning can proceed."
