archmap: 2
doc: flow
id: upgrade
verified:
  revision: "5f9030cfe516079d2cec9d88b0164f9fa39b2a72"
  verified_on: "2026-10-07"
trigger: "Operator runs depengine upgrade to reconcile tracked installations with targets recorded in depengine.lock."
steps:
  - from: operator
    to: cli
    action: "Invokes upgrade with schema, manifest, dry-run, filtering, confirmation, and arbitrary-code authorization options."
    confidence: inferred
  - from: cli
    to: configuration
    action: "Loads the effective schema and target facts used for tracked-candidate resolution."
    evidence: ["internal/app/upgrade.go:460-548"]
    confidence: confirmed
  - from: cli
    to: state-and-lock
    action: "Loads tracked state and lock data; finds the exact selected schema candidate and requires a v2 projection target or candidate-specific v1 pin before identifying outdated tools."
    evidence: ["internal/app/upgrade.go:131-201", "internal/app/upgrade.go:207-298", "internal/app/upgrade.go:563-577", "internal/app/lock_pin.go"]
    symbols:
      - name: collectOutdatedTools
        path: internal/app/upgrade.go
        role: "Selects the exact tracked candidate and discovers lock-target drift."
    confidence: confirmed
  - from: cli
    to: reconciliation
    action: "Passes the exact resolved target and discovery-time tracked state to the executor; the executor checks that snapshot under lock before WAL creation/removal, then installs and verifies the target."
    evidence: ["internal/app/upgrade.go:336-383", "internal/exec/resolved_candidate.go", "internal/exec/replacement.go"]
    symbols:
      - name: ExecuteResolvedUpgradeCandidate
        path: internal/exec/resolved_candidate.go
        role: "Executes the locked target without fallback and requires the tracked state captured at discovery."
    confidence: confirmed
  - from: reconciliation
    to: state-and-lock
    action: "Before destructive mutation, replacement execution records a durable replacement transaction containing prior tracked state, exact target identity, and resource claims."
    evidence: ["internal/exec/replacement.go:19-126", "internal/state/replacement.go:12-77"]
    symbols:
      - name: replaceCandidate
        path: internal/exec/replacement.go
        role: "Executor replacement state machine for remove/install/verify/commit."
      - name: BeginReplacement
        path: internal/state/replacement.go
        role: "Durable write-ahead boundary before removal."
    confidence: confirmed
  - from: reconciliation
    to: adapters
    action: "Removal and installation happen inside the replacement state machine through the exact adapter and resolved plan; normal candidate fallback is not re-entered."
    evidence: ["internal/exec/replacement.go:19-170", "internal/exec/resolved_candidate.go:14-48"]
    confidence: confirmed
  - from: reconciliation
    to: state-and-lock
    action: "Verified replacement state, resource ownership, and replacement-journal progress are persisted under the state lock; restart recovery observes old and desired identities before resuming."
    evidence: ["internal/state/replacement.go:117-260", "internal/exec/run.go:95-178"]
    confidence: confirmed
  - from: cli
    to: operator
    action: "Reports per-tool upgraded, unchanged, dry-run, and failure outcomes with process status."
    evidence: ["internal/app/upgrade.go:412-455"]
    confidence: inferred
failure_modes:
  - "Missing lock data or a missing/unresolvable v2 target fails closed."
  - "Ambiguous tracked-candidate identity or a changed discovery snapshot is rejected before WAL creation or removal."
  - "Ambiguous legacy replacement records and uncertain after-hook outcomes block recovery rather than selecting a candidate or replaying a hook."
  - "Unknown, broken, conflicting, or ambiguous replacement recovery blocks rather than guessing whether removal or installation happened."
  - "An invalid or mismatched v2 universal projection fails closed before pinned replacement planning can proceed."
