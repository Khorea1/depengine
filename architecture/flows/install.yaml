id: install
verified:
  revision: "5f9030cfe516079d2cec9d88b0164f9fa39b2a72"
  verified_on: "2026-10-07"
trigger: "Operator runs depengine install with a schema/manifest selection."
steps:
  - from: operator
    to: cli
    action: "Invokes the install command and supplies command-line options."
    confidence: inferred
  - from: cli
    to: configuration
    action: "Loads target facts, parses the schema/manifest, and validates the effective configuration."
    evidence: ["internal/app/install.go:366-382", "internal/app/helpers.go:117-160"]
    confidence: confirmed
  - from: cli
    to: state-and-lock
    action: "Loads lock semantics, including the v2 universal projection when present, and snapshots pre-install state before mutation."
    evidence: ["internal/app/install.go:385-420"]
    confidence: confirmed
  - from: cli
    to: reconciliation
    action: "Builds/configures the executor and starts reconciliation for the selected tools."
    evidence: ["internal/app/install.go:203-233", "internal/app/install.go:427-431"]
    confidence: confirmed
  - from: reconciliation
    to: state-and-lock
    action: "Recovers durable replacement transactions first, then preparation transactions, before any new host mutation; already-reconciled commits are recorded as terminal results for the run."
    evidence: ["internal/exec/run.go:95-150", "internal/exec/preparation.go:674-796"]
    confidence: confirmed
  - from: reconciliation
    to: planning
    action: "Computes dependency execution order and builds/validates static candidate intent before concrete resolution or host mutation."
    evidence: ["internal/exec/run.go:517-548", "internal/exec/capability.go:51-76", "internal/exec/attempt.go:77-95"]
    confidence: confirmed
  - from: reconciliation
    to: adapters
    action: "Resolves candidate identity, observes the host, and executes the chosen method through AdapterV2."
    evidence: ["internal/exec/resolution.go:57-78", "internal/exec/resolution.go:105-131", "internal/exec/attempt.go:401-457", "internal/exec/adapter.go:49-78"]
    confidence: confirmed
  - from: reconciliation
    to: state-and-lock
    action: "Persists reconciled installation state under the state lock."
    evidence: ["internal/exec/state.go:96-135"]
    confidence: confirmed
failure_modes:
  - "Schema/manifest parse or validation failure stops before executor mutation begins."
  - "Candidate resolution/compatibility failure can reject one method and allow normal fallback to another candidate."
  - "State-lock or state-save failure makes persistence failure explicit instead of silently claiming success."
  - "An unreconciled durable preparation transaction stops the run before unrelated new mutation can proceed."
