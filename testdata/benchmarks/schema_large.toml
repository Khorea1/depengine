# Large benchmark schema: ~50 tools with 5 methods each.
# Complex dependency chains, requires, when conditions, placeholders.

[defaults]
manager = "native"
method_order = ["native", "cargo", "go", "pip", "pipx", "uv", "aur", "git", "http"]

[tools]
simple = [
  "tool00", "tool01", "tool02", "tool03", "tool04",
  "tool05", "tool06", "tool07", "tool08", "tool09",
]

  [tools.tool10]
  postinstall = "echo tool10 installed on {distro_family} with {arch}"
  pacman = "tool10-pacman"
  cargo = { pkg = "tool10-cargo", when = { distro_family = ["arch", "debian"] } }
  go = "tool10-go"
  pip = { pkg = "tool10-pip", when = { distro_family = ["arch", "debian"] } }
  git = { url = "https://github.com/user/tool10.git", branch = "v10.3" }

