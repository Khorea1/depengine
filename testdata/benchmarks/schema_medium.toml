schema_version = 1

# Medium benchmark schema: ~10 tools with 3 methods each.
# Mix of native overrides, language methods, requires, when conditions.

[defaults]
manager = "native"
method_order = ["native", "cargo", "go", "aur", "git", "http"]

[tools]
  [tools.neovim]
  requires = ["neovim"]
  post_install = "echo {name} installed on {distro_family}"
  pacman = "neovim"
  cargo = {pkg = "github.com/user/neovim", when = { distro_family = ["arch", "fedora"] }}
  pip = {pkg = "neovim-tool", when = { distro_family = ["debian", "suse"] }}

[tools.git]
apt = "git"
go = "github.com/inst/git"
pip = "git-pkg"
requires = ["neovim"]

  [tools.ripgrep]
  dnf = "ripgrep"
  pip = {pkg = "github.com/user/ripgrep", when = { distro_family = ["arch", "fedora"] }}
  http = {url = "https://releases.example.com/ripgrep-{arch}-{os}.tar.gz", checksum = "sha256:abc123"}

[tools.fd]
brew = "fd"
git = { url = "https://github.com/inst/fd.git" }
http = { url = "https://releases.example.com/fd-{arch}-{os}.tar.gz" }

  [tools.fzf]
  post_install = "echo {name} installed on {distro_family}"
  pacman = "fzf"
  http = {url = "https://releases.example.com/fzf-{arch}-{os}.tar.gz", when = { distro_family = ["arch", "fedora"] }}
  go = {pkg = "fzf-tool", when = { distro_family = ["debian", "suse"] }}

[tools.zsh]
apt = "zsh"
cargo = "github.com/inst/zsh"
go = "zsh-pkg"

  [tools.tmux]
  requires = ["neovim"]
  dnf = "tmux"
  go = {pkg = "github.com/user/tmux", when = { distro_family = ["arch", "fedora"] }}
  git = {url = "https://github.com/tmux/tmux.git", when = { distro_family = ["debian", "suse"] }}

[tools.htop]
brew = "htop"
pip = "github.com/inst/htop"
git = { url = "https://github.com/htop-dev/htop.git" }
requires = ["neovim"]

  [tools.bat]
  post_install = "echo {name} installed on {distro_family}"
  pacman = "bat"
  git = {url = "https://github.com/sharkdp/bat.git", when = { distro_family = ["arch", "fedora"] }}
  cargo = {pkg = "bat-tool", when = { distro_family = ["debian", "suse"] }}

[tools.eza]
apt = "eza"
http = { url = "https://releases.example.com/eza-{arch}.tar.gz", checksum = "sha256:def456" }
cargo = "github.com/user/eza"
