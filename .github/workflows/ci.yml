name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history so git describe works

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test ./...

    - name: Run static analysis (vet)
      run: go vet ./...

    - name: Build static binary
      run: scripts/build-static.sh
      env:
        VERSION: v0.1.0 # Placeholder for now, release workflow injects correct version

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: depengine-binary
        path: depengine
