# .goreleaser.yaml
# CI/CD configuration for depengine

version: 2

project_name: depengine

before:
  hooks:
    # Shell completion is generated by Cobra straight from the real flag
    # definitions in cli.go/install.go/etc — not hand-maintained here — so
    # it can never drift out of sync with the actual CLI. `go run .` builds
    # for the release runner's host OS/arch regardless of the cross-compile
    # targets below; only the generated *text* is packaged.
    - sh -c 'mkdir -p scripts && go run . completion bash > scripts/depengine-completion.bash'
    - sh -c 'mkdir -p scripts && go run . completion zsh > scripts/depengine-completion.zsh'
    - sh -c 'mkdir -p scripts && go run . completion fish > scripts/depengine-completion.fish'

builds:
  - id: depengine
    main: .
    binary: depengine
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: "386"
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

nfpms:
  - id: depengine-nfpms
    package_name: depengine
    file_name_template: "depengine_{{ .Version }}_{{ .Arch }}"
    vendor: depengine
    homepage: https://github.com/Khorea1/depengine
    maintainer: depengine team
    description: Distro-agnostic dependency installer
    license: GPL-3.0-or-later
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    contents:
      - src: scripts/detect_os.sh
        dst: /usr/lib/depengine/detect_os.sh
      - src: docs/depengine.1
        dst: /usr/share/man/man1/depengine.1
      - src: scripts/depengine-completion.bash
        dst: /usr/share/bash-completion/completions/depengine
      - src: scripts/depengine-completion.zsh
        dst: /usr/share/zsh/site-functions/_depengine
      - src: scripts/depengine-completion.fish
        dst: /usr/share/fish/vendor_completions.d/depengine.fish

# Homebrew Casks (the `brews` formula pipe is deprecated since GoReleaser
# v2.10 and fails `goreleaser check` on v2.16+). Upload is skipped: publishing
# needs a homebrew-tap repository and token this project does not have yet.
homebrew_casks:
  - name: depengine
    homepage: https://github.com/Khorea1/depengine
    description: Distro-agnostic dependency installer
    license: GPL-3.0-or-later
    skip_upload: "true"

# Winget manifests are generated but not published: publishing needs a
# winget-pkgs fork and token that this repository does not have yet.
# skip_upload keeps the manifests in dist/ for inspection.
winget:
  - name: depengine
    publisher: Khorea1
    short_description: "Distro-agnostic dependency installer"
    license: GPL-3.0-or-later
    package_identifier: Khorea1.depengine
    skip_upload: "true"

archives:
  - id: depengine-archives
    name_template: "depengine_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - scripts/detect_os.sh
      - docs/depengine.1
      - scripts/depengine-completion.*
      - README.md
      - LICENSE

checksum:
  name_template: "depengine_{{ .Version }}_checksums.txt"
  algorithm: sha256

# SPDX SBOMs for every published archive, derived from the module graph.
sboms:
  - id: depengine-sboms
    artifacts: archive

# Keyless cosign signatures over the checksum file (Fulcio + Rekor via
# GitHub OIDC; no long-lived keys). Requires `id-token: write` on the
# release job and cosign on PATH.
signs:
  - id: depengine-signs
    cmd: cosign
    # Distinct certificate/signature outputs: ${certificate} requires the
    # certificate field below (it expands empty without it). Cosign v3
    # removed both flags in favor of --bundle, so the release pins cosign
    # v2 (see cosign-release in release.yml) to keep the split .sig/.pem
    # format the verification docs promise.
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  github:
    owner: Khorea1
    name: depengine
  draft: true
  prerelease: auto
  name_template: "depengine {{.Version}}"
