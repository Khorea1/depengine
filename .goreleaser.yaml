# .goreleaser.yaml
# CI/CD configuration for depengine

version: 2

project_name: depengine

builds:
  - id: depengine
    main: ./main.go
    binary: depengine
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: "386"
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

nfpms:
  - id: depengine-nfpms
    package_name: depengine
    file_name_template: "depengine_{{ .Version }}_{{ .Arch }}"
    vendor: depengine
    homepage: https://github.com/depengine/depengine
    maintainer: depengine team
    description: Distro-agnostic dependency installer
    license: MIT
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    files:
      scripts/detect_os.sh: /usr/lib/depengine/detect_os.sh
      docs/depengine.1: /usr/share/man/man1/depengine.1
      scripts/depengine-completion.bash: /usr/share/bash-completion/completions/depengine
      scripts/depengine-completion.zsh: /usr/share/zsh/site-functions/_depengine
      scripts/depengine-completion.fish: /usr/share/fish/vendor_completions.d/depengine.fish

brews:
  - name: depengine
    homepage: https://github.com/depengine/depengine
    description: Distro-agnostic dependency installer
    license: MIT
    repository:
      owner: depengine
      name: homebrew-tap
    commit_author:
      name: depengine-bot
      email: bot@depengine.dev
    install: |
      bin.install "depengine"
      lib.install "scripts/detect_os.sh" => "depengine/detect_os.sh"
      man1.install "docs/depengine.1"
      bash_completion.install "scripts/depengine-completion.bash"
      zsh_completion.install "scripts/depengine-completion.zsh"
      fish_completion.install "scripts/depengine-completion.fish"

wings:
  - id: depengine-wings
    name_template: "depengine_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

archives:
  - id: depengine-archives
    name_template: "depengine_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - scripts/detect_os.sh
      - docs/depengine.1
      - scripts/depengine-completion.*
      - README.md
      - LICENSE

checksum:
  name_template: "depengine_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  github:
    owner: depengine
    name: depengine
  draft: true
  prerelease: auto
  name_template: "depengine {{.Version}}"