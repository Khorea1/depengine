schema_version = 1

# Schema with MANY simultaneous errors
[tools]
# 1. Empty method config (no native key, no git/http/cargo)
misconfigured = {}

# 2. Self-dependency cycle
self_ref = { requires = ["self_ref"] }

# 3. Dangling ref to non-existent tool
needs_missing = { requires = ["i_dont_exist"] }

# 4. Unknown placeholder
bad_placeholder = { http = { url = "https://example.com/{BAD_PLACEHOLDER}/file.deb" } }

# 5. Induced cycle: x→y→x
x = { requires = ["y"] }
y = { requires = ["x"] }

# 6. Malformed URL
bad_url = { http = { url = "not-a-valid-url-at-all" } }

# 7. Unknown distro family
exotic_distro = { native = { pkg = "neofetch", when = { distro_family = ["madeup_os"] } } }
