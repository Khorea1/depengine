schema_version = 1

# wt em E (plano §3.3): GitHub como alternativa, AUR preservado.
[tools.wt]
method_only = ["native", "aur", "cargo", "conda", "github"]
post_install = [
  { run = ["wt", "config", "shell", "install"], when = { target_family = ["unix"] } },
  { run = ["git-wt", "config", "shell", "install"], when = { target_family = ["windows"] } },
]

[tools.wt.native]
pkg_overrides = { brew = "worktrunk", winget = "max-sixty.worktrunk" }
when = { os = ["darwin", "windows"] }

[tools.wt.aur]
pkg = "worktrunk-bin"
when = { distro_family = ["arch"] }

[tools.wt.cargo]
pkg = "worktrunk"

[tools.wt.conda]
pkg = "worktrunk"
channels = ["conda-forge"]

[tools.wt.github]
repo = "max-sixty/worktrunk"
asset = "worktrunk-{arch}-unknown-linux-musl.tar.xz"
checksum = "sha256:auto"
strip_components = 1
scope = "user"
entrypoints = { wt = "wt", git-wt = "git-wt" }

[[tools.wt.github.distributions]]
when = { os = ["linux"], is_android = false }

[[tools.wt.github.distributions]]
when = { os = ["darwin"] }
asset = "worktrunk-{arch}-apple-darwin.tar.xz"
