schema_version = 1

[defaults]
method_order = ["github"]

# Baseline A: omp com 3 candidatos github explícitos (reconstrução fiel à
# auditoria: glibc/musl/darwin; fixture de spike, não manifesto pessoal).
[tools.omp]
method_only = ["github"]

  [tools.omp.github-linux]
  kind = "github"
  repo = "can1357/oh-my-pi"
  asset = "omp-{version}-{os_any}_{arch_any}.tar.gz"
  checksum = "sha256:auto"
  scope = "user"
  entrypoints = { omp = "omp" }
  when = { os = ["linux"], libc = ["glibc"] }

  [tools.omp.github-musl]
  kind = "github"
  repo = "can1357/oh-my-pi"
  asset = "omp-{version}-{os_any}_musl_{arch_any}.tar.gz"
  checksum = "sha256:auto"
  scope = "user"
  entrypoints = { omp = "omp" }
  when = { os = ["linux"], libc = ["musl"] }

  [tools.omp.github-mac]
  kind = "github"
  repo = "can1357/oh-my-pi"
  asset = "omp-{version}-{os_any}_{arch_any}.tar.gz"
  checksum = "sha256:auto"
  scope = "user"
  entrypoints = { omp = "omp" }
  when = { os = ["darwin"] }
