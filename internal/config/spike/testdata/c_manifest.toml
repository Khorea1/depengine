schema_version = 1

[manifest]
allow_new_tools = true

# Mesmo conteúdo de a_manifest.toml com os grupos github compactados
# (sintaxe experimental; nunca alimentar ao parser de produção).
[packages.br.github]
repo = "Dicklesworthstone/beads_rust"
asset = "br-{version}-{os_any}_{arch_any}.tar.gz"
checksum = "sha256:auto"
scope = "user"
entrypoints = { br = "br" }

cases = [
  { label = "github-mac", when = { os = ["darwin"] } },
  { label = "github-linux", when = { os = ["linux"], libc = ["glibc"] } },
  { label = "github-musl", when = { os = ["linux"], libc = ["musl"] }, asset = "br-{version}-{os_any}_musl_{arch_any}.tar.gz" },
  { label = "github-windows", when = { os = ["windows"], arch = ["x86_64"] }, asset = "br-{version}-{os_any}_{arch_any}.zip", entrypoints = { br = "br.exe" } },
]

[packages.omp]
method_only = ["aur", "native", "github", "nix"]

[packages.omp.aur]
pkg = "oh-my-pi-bin"
when = { distro_family = ["arch"] }

[packages.omp.native]
pkg_overrides = { brew = "omp" }
sources = [{ kind = "brew-tap", name = "can1357/tap", url = "https://github.com/can1357/homebrew-tap" }]
when = { os = ["darwin"] }

[packages.omp.github]
repo = "can1357/oh-my-pi"
asset = "omp-linux-{arch_any}"
checksum = "sha256:auto"
checksum_url = "https://github.com/can1357/oh-my-pi/releases/latest/download/SHA256SUMS.txt"
checksum_file_format = "sha256sum"
scope = "user"

cases = [
  { label = "github-linux", when = { os = ["linux"], libc = ["glibc"] } },
  { label = "github-musl", when = { os = ["linux"], libc = ["musl"] }, asset = "omp-linux-musl-{arch_any}" },
  { label = "github-mac", when = { os = ["darwin"] }, asset = "omp-darwin-{arch_any}" },
]

[packages.omp.nix]
pkg = "omp"
source = "github:can1357/oh-my-pi"

[packages.wt]
method_only = ["native", "aur", "cargo", "conda", "github"]
post_install = [
  { run = ["wt", "config", "shell", "install"], when = { target_family = ["unix"] } },
  { run = ["git-wt", "config", "shell", "install"], when = { target_family = ["windows"] } },
]

[packages.wt.native]
pkg_overrides = { brew = "worktrunk", winget = "max-sixty.worktrunk" }
when = { os = ["darwin", "windows"] }

[packages.wt.aur]
pkg = "worktrunk-bin"
when = { distro_family = ["arch"] }

[packages.wt.cargo]
pkg = "worktrunk"

[packages.wt.conda]
pkg = "worktrunk"
channels = ["conda-forge"]

[packages.wt.github]
repo = "max-sixty/worktrunk"
asset = "worktrunk-{arch}-apple-darwin.tar.xz"
checksum = "sha256:auto"
strip_components = 1
scope = "user"
entrypoints = { wt = "wt", git-wt = "git-wt" }

cases = [
  { label = "github-mac", when = { os = ["darwin"] } },
  { label = "github-linux", when = { os = ["linux"] }, asset = "worktrunk-{arch}-unknown-linux-musl.tar.xz" },
]
