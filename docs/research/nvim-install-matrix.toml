# Capability stress test for Neovim's non-trivial installation paths.
# This is parseable reference material, not a recommended "install every
# method" user schema.

schema_version = 1

[tools.software-properties-common]
dependency_only = true
apt = "software-properties-common"

[tools.nvim]
method_prefer = ["native", "ppa", "copr", "scoop", "snap", "github", "appimage", "msi", "git"]

  [tools.nvim.native]
  pkg = "neovim"

  [tools.nvim.ppa]
  kind = "native"
  pkg = "neovim"
  when = { distro_id = ["ubuntu"] }
  requires = ["software-properties-common"]
  sources = [{ kind = "apt-ppa", name = "ppa:neovim-ppa/stable" }]

  [tools.nvim.copr]
  kind = "native"
  pkg = "neovim"
  when = { distro_family = ["fedora"] }
  sources = [{ kind = "dnf-copr", name = "agriffis/neovim-nightly" }]

  [tools.nvim.scoop]
  pkg = "neovim"
  # Scoop's main bucket is tracked and available by default. Declare a
  # scoop-bucket source only for optional or custom buckets.

  [tools.nvim.choco-nightly]
  kind = "choco"
  pkg = "neovim"
  prerelease = true

  [tools.nvim.snap]
  pkg = "nvim"
  confinement = "classic"
  channel = "stable"

  [tools.nvim.github]
  repo = "neovim/neovim"
  asset = "nvim-{os_any}-{arch_any}.tar.gz"
  strip_components = 1
  extract_to = "~/.local/opt/nvim"
  entrypoints = { nvim = "bin/nvim" }
  link_dir = "~/.local/bin"

  [tools.nvim.appimage]
  repo = "neovim/neovim"
  asset = "nvim-linux-{arch_any}.appimage"
  binary = "nvim"
  when = { os = ["linux"] }

  [tools.nvim.msi]
  repo = "neovim/neovim"
  asset = "nvim-win64.msi"
  product_name = "Neovim"
  publisher = "Neovim"

  [tools.nvim.git]
  url = "https://github.com/neovim/neovim"
  branch = "stable"
  build = [{ run = ["make", "CMAKE_BUILD_TYPE=Release"] }, { run = ["sudo", "make", "install"] }]
  binary = "nvim"
  managed_paths = ["/usr/local/bin/nvim", "/usr/local/share/nvim"]
