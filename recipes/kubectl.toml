recipe_version = 1

[packages.kubectl]
method_only = ["native", "http"]

[packages.kubectl.native]
pkg = "kubectl"
pkg_overrides = { brew = "kubectl", choco = "kubernetes-cli", scoop = "kubectl", winget = "Kubernetes.kubectl" }

# Raw release binaries are pinned to v1.37.2 so every URL keeps a literal
# SHA-256. Bump the tag, URL and checksum together.
[packages.kubectl.http-linux-x64]
kind = "http"
url = "https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl"
checksum = "sha256:c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4"
binary = "kubectl"
scope = "user"
when = { os = ["linux"], arch = ["x86_64"] }

[packages.kubectl.http-linux-arm64]
kind = "http"
url = "https://dl.k8s.io/release/v1.37.2/bin/linux/arm64/kubectl"
checksum = "sha256:fcc16f63186659d9722014b7e02d5fdd2d4e669cb8c0ab66365d7d3b8ba03509"
binary = "kubectl"
scope = "user"
when = { os = ["linux"], arch = ["arm64"] }

[packages.kubectl.http-macos-x64]
kind = "http"
url = "https://dl.k8s.io/release/v1.37.2/bin/darwin/amd64/kubectl"
checksum = "sha256:88379aff5c8111de6be0a394adffba2819e44cde269f3ab23cef76de1a48eaa8"
binary = "kubectl"
scope = "user"
when = { os = ["darwin"], arch = ["x86_64"] }

[packages.kubectl.http-macos-arm64]
kind = "http"
url = "https://dl.k8s.io/release/v1.37.2/bin/darwin/arm64/kubectl"
checksum = "sha256:55701af0d51815ee335f240e48acf0959c3c23017ed3fa816e880c4a92bae581"
binary = "kubectl"
scope = "user"
when = { os = ["darwin"], arch = ["arm64"] }
