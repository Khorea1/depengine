#:schema ./schema/depengine.schema.json
schema_version = 1

# ==============================================================================
# schema.toml — TEMPLATE / REFERENCE
# ==============================================================================
# Version 1 is the sole current contract; other versions fail closed rather
# than selecting a legacy parser or migration path.
# This file describes how to install dependencies in a distro-agnostic way.
# The engine (the program that reads this file) decides HOW to install each
# tool, trying declared methods in the configured effective order until one succeeds.
#
# GOLDEN RULE: everything OMITTED = default behavior defined by the engine
# (e.g., package name = tool name, if nothing is specified).
# ==============================================================================


[defaults]
# Manager used when a tool specifies nothing (see "simple" section below).
# "native" = the user's distro native package manager
# (apt, pacman, dnf, zypper, etc — the engine detects it automatically).
manager = "native"

# AUR helper to use when any method is "aur". Only relevant on Arch-based.
aur_helper = "paru"

# When a tool declares MORE THAN ONE candidate method (e.g., cargo, go, aur, git),
# this prefix defines the preferred trial order. Unlisted defaults remain as
# fallbacks; use a tool's method_only when the list must be exclusive.
method_order = ["native", "cargo", "github", "http"]


# ==============================================================================
# [tools] — ALL dependencies live inside here
# ==============================================================================
[tools]

# ------------------------------------------------------------------------
# CASE 1 — "Simple" tool: package name is the same on every relevant distro.
# No table needed, just list the name. Uses `defaults.manager`.
# ------------------------------------------------------------------------
simple = [
  "zsh",
  "zathura",
  "w3m",
  "rofi",
  "mpv",
  "kitty",
  "tmux",
  "rclone",
  "docker-compose",
  "bat",
  "lsd",
]


# ------------------------------------------------------------------------
# CASE 2 — Package name differs by native manager.
# Format: inline table with `<manager> = "package-name-in-that-manager"`.
# Managers not listed here use the tool name itself as fallback.
# ------------------------------------------------------------------------
# fd: apt names it "fd-find" (a pre-existing "fd" package already claimed the
# name); fd also ships prebuilt glibc/musl/aarch64 binaries with a real
# {latest}-safe filename scheme, so its full multi-arch/libc definition is
# promoted to a full block — see CASE 9 below (search for [tools.fd]).
hypr = { pacman = "hyprland" }

golang = { pacman = "go", apt = "golang-go" }

# python-pip: bootstrapping pip itself (before pip/pipx/uv can be used) is a
# native-manager job with real per-family divergence: Alpine prefixes Python
# packages with "py3-", Gentoo/Portage packages are category-qualified
# ("dev-python/..."), and RPM/DEB families use "python3-".
python-pip = { pacman = "python-pip", apt = "python3-pip", dnf = "python3-pip", zypper = "python3-pip", apk = "py3-pip", xbps = "python3-pip", emerge = "dev-python/pip" }

# ------------------------------------------------------------------------
# CASE 3 — Language manager (pip, pipx, uv, go, cargo, npm, gem...).
# The value is the package/module name IN THAT ecosystem — it may differ
# from the final binary name.
# ------------------------------------------------------------------------
organize = { pip = "organize-tool", pipx = "organize-tool", uv = "organize-tool" } # or { python = "organize-tool" }
fzf = { go = "github.com/junegunn/fzf" }
lf = { go = "github.com/gokcehan/lf" }


# ------------------------------------------------------------------------
# CASE 4 — cargo installing directly from a git repository instead of
# crates.io. Sub-key `git` within the cargo method.
aichat = { aur = { pkg = "aichat", when = { distro_family = [
  "arch",
] } }, cargo = { git = "https://github.com/sigoden/aichat" } }
matugen = { cargo = { git = "https://github.com/InioX/matugen" } }


# ------------------------------------------------------------------------
# CASE 5 — "git" method: clones the repo and runs a manual build command.
# Fields:
#   url, branch, depth             = clone source and history selection
#   build                          = command argv (or sequential command list)
#                                    executed inside the clone; legacy strings
#                                    use POSIX sh -c
#   extract_to, artifact, binary  = copied output and executable identity
#   managed_paths                 = exact absolute paths owned by the recipe
# ------------------------------------------------------------------------
ctpv = { git = { url = "https://github.com/NikitaIvanovV/ctpv", build = [
  { run = [
    "make",
  ] },
  { run = [
    "sudo",
    "make",
    "install",
  ] },
], when = { target_family = [
  "unix",
] } } }
fasd = { git = { url = "https://github.com/clvv/fasd", build = "PREFIX=$HOME/.local make install", when = { target_family = [
  "unix",
] } } }


# ------------------------------------------------------------------------
# CASE 6 — "http" method: downloads a ready-made artifact (deb, zip, binary...).
# The checksum field accepts various algorithms and formats:
#   sha256:<hex>        → fixed SHA-256 (recommended)
#   sha256:auto         → automatic hash resolution
#   md5:<hex>, sha1:<hex>, sha512:<hex> → other algorithms
#   checksum_url        → explicit URL of the checksums file
#   checksum_file_format → "sha256sum" (default), "bsd", or "raw"
#   signature_url       → GPG verification of the checksum signature
fastfetch = { http = { url = "https://github.com/fastfetch-cli/fastfetch/releases/download/{latest}/fastfetch-linux-amd64.deb", checksum = "sha256:auto", when = { os = [
  "linux",
] } } }

# Example with SHA-512 and explicit checksum_url:
"tool-example" = { http = { url = "https://example.com/tool-{latest}.tar.gz", checksum = "sha512:auto", checksum_url = "https://example.com/SHA512SUMS" } }

# ------------------------------------------------------------------------
# CASE 7 — Tool dependency and simultaneous package override.
# `requires` is a TOOL-LEVEL field (not method-level): it applies no matter
# which method ends up installing the tool.
# ------------------------------------------------------------------------
zathura-pdf-mupdf = { requires = ["zathura"], pacman = "zathura-pdf-mupdf" }
# DepartureMono dependencies — declared as simple native tools. `unzip` extracts
# the HTTP zip payload; `fc-cache` (provided by fontconfig) runs as post_install
# to register the fonts. On Termux fc-cache ships in `fontconfig-utils` (pkg),
# hence the per-manager override.
unzip = { native = "unzip" }
fontconfig = { native = { pkg = "fontconfig", pkg_overrides = { pkg = "fontconfig-utils" } } }


# ------------------------------------------------------------------------
# CASE 8 — Complex case: multiple competing methods + distro condition +
# hook after installation. This CANNOT be inlined (it would be unreadable or TOML
# does not allow line breaks inside inline tables), so we promote it to a
# full block with sub-tables.
#
# Rules for this format:
#   - [tools.NAME]              → tool-level fields: `requires`,
#                                 `post_install` (runs after ANY method succeeds).
#   - [tools.NAME.method]       → one block per candidate method. TOML key
#                                 order has no meaning here — ties are broken
#                                 deterministically by label. To control the
#                                 trial order explicitly, use the tool-level
#                                 `method_prefer`/`method_only` fields, or set
#                                 the engine-wide default in
#                                 [defaults].method_order.
#   - `when`                    → applicability condition WITHIN the method
#                                 (never its own nesting level, never becomes
#                                 a "manager" name). If the condition doesn't
#                                 match, the engine skips this method and moves
#                                 to the next.
# ------------------------------------------------------------------------

# ==============================================================================
# CASE 9 — `when` with multiple platform dimensions.
# The `when` field accepts several simultaneous conditions (AND across fields,
# OR within each list). Methods whose condition doesn't match are silently
# skipped — the engine tries the next method in order.
#
# Available dimensions:
#   distro_family → resolved family (arch, debian, fedora, alpine, ...)
#   distro_id     → exact distro ID (ubuntu, arch, fedora, ...)
#   arch          → architecture (x86_64, aarch64, armv7l, ...)
#   os            → operating system (linux, darwin, windows, ...)
#   target_family → OS family (unix = linux/darwin/BSD/termux, windows)
#   kernel        → kernel version (uname -r)
#   libc          → C library (glibc, musl, ...) — prefix matching
#   init_system   → init system (systemd, openrc, runit, ...)
#   is_wsl        → true/false (WSL environment)
#   is_container  → true/false (container environment)
#   is_android    → true/false (Termux/Android; note `os` reports "linux"
#                   on Termux, so use this instead of os = ["android"])
# ==============================================================================

# --- Binary ships separate glibc and musl builds (real Rust cross-release) ---
# fd's tag and its asset filenames both carry the "v" prefix consistently
# (v10.2.0 in the path AND the filename), so {latest} is safe to reuse in
# both places here — contrast with the restic/node_exporter case further
# below, where that is NOT true.
[tools.fd]
[tools.fd.native]
pkg_overrides = { apt = "fd-find" } # everywhere else: "fd" (tool name)

[tools.fd.github]
repo = "sharkdp/fd"
asset = "fd-{version}-{arch_any}-unknown-linux-gnu.tar.gz"
checksum = "sha256:auto"
strip_components = 1                  # discard the archive's top-level directory
extract_to = "~/.local/opt/fd"        # own the complete extracted payload here
entrypoints = { fd = "fd" }           # expose this payload-relative executable
link_dir = "~/.local/bin"             # create launchers here without flattening the payload
when = { os = ["linux"], libc = ["glibc"] }

# musl build (Alpine, distroless/scratch containers)
[tools.fd.github-musl]
kind = "github"
repo = "sharkdp/fd"
asset = "fd-{version}-{arch_any}-unknown-linux-musl.tar.gz"
checksum = "sha256:auto"
strip_components = 1
extract_to = "~/.local/opt/fd"
entrypoints = { fd = "fd" }
link_dir = "~/.local/bin"
when = { os = ["linux"], libc = ["musl"] }


# --- GitHub releases: match the real asset list across OS/arch naming
# conventions and pin the resolved release in depengine.lock. A raw asset
# defaults to the tool name, so binary = "yq" is unnecessary. ---
[tools.yq.github]
repo = "mikefarah/yq"
asset = "yq_{os_any}_{arch_any}"
checksum = "sha256:auto"
extract_to = "~/.local/bin"
when = { target_family = ["unix"] } # ~/.local/bin is a Unix-specific destination


# --- Two mismatches stacked at once: restic and node_exporter tag their
# releases with a "v" prefix (v0.17.3, v1.8.2) but the asset FILENAMES strip
# it (restic_0.17.3_..., node_exporter-1.8.2....), AND their assets use
# GOARCH naming, not uname's. {latest} substitutes the raw tag verbatim and
# has no way to strip a prefix mid-string, so a filename shaped like this
# can't safely use {latest} twice. These blocks demonstrate explicit HTTP
# pins; for new GitHub release declarations, prefer the `github` method above. ---
[tools.restic]
[tools.restic.http]
url = "https://github.com/restic/restic/releases/download/v0.17.3/restic_0.17.3_linux_amd64.bz2"
checksum = "sha256:auto"
extract_to = "~/.local/bin"
binary = "restic"
when = { arch = ["x86_64"], os = ["linux"] }

[tools.restic.http-arm64]
kind = "http"
url = "https://github.com/restic/restic/releases/download/v0.17.3/restic_0.17.3_linux_arm64.bz2"
checksum = "sha256:auto"
extract_to = "~/.local/bin"
binary = "restic"
when = { arch = ["aarch64"], os = ["linux"] }

[tools.node_exporter.github]
repo = "prometheus/node_exporter"
asset = "node_exporter-{version}.{os_any}-{arch_any}.tar.gz"
checksum = "sha256:auto"
strip_components = 1
extract_to = "~/.local/opt/node_exporter"
entrypoints = { node_exporter = "node_exporter" }
link_dir = "~/.local/bin"


# --- Same manager binary name ("pkg"), two unrelated clans (FreeBSD vs
# Termux share it — see native/registry.go), disambiguated with `when`
# instead of a manager-keyed override. Also: BSD `make` is already spoken
# for (BSD make, not GNU make), so GNU Make ships as a separate "gmake"
# package there — a second native-kind method candidate is declared with an
# explicit `kind = "native"` override and its own `when`. ---
[tools.gnu-make]
[tools.gnu-make.native]
pkg = "make"
when = { os = ["linux"] }

[tools.gnu-make.native-bsd]
kind = "native"
pkg = "gmake"
when = { distro_family = ["freebsd", "openbsd", "netbsd"] }


# --- WSL vs native Linux ---
[tools.podman]
[tools.podman.native]
when = { is_wsl = false }

[tools.podman.http]
url = "https://github.com/containers/podman/releases/download/{latest}/podman-wsl-{arch}.zip"
when = { is_wsl = true }


# --- One Neovim identity, with real package IDs and owned release payloads ---
[tools.neovim]
[tools.neovim.native]
pkg = "neovim"
pkg_overrides = { winget = "Neovim.Neovim" }

[tools.neovim.scoop]
pkg = "neovim"

[tools.neovim.choco]
pkg = "neovim"

[tools.neovim.github]
repo = "neovim/neovim"
asset = "nvim-{os_any}-{arch_any}.tar.gz"
checksum = "sha256:auto"
strip_components = 1
extract_to = "~/.local/opt/neovim"
entrypoints = { nvim = "bin/nvim" }
link_dir = "~/.local/bin"
when = { target_family = ["unix"] }

# Windows installer: exact product identity is required for check/remove.
[tools.neovim.msi]
repo = "neovim/neovim"
asset = "nvim-win64.msi"
product_name = "Neovim"
publisher = "neovim.io"
when = { target_family = ["windows"] }


# --- Kernel-specific DKMS package ---
[tools.v4l2loopback]
[tools.v4l2loopback.aur]
pkg = "v4l2loopback-dkms"
when = { distro_family = ["arch"], kernel = ["6.7", "6.8", "6.9"] }


# --- macOS vs Linux: completely different platform ---
[tools.skhd]
[tools.skhd.brew]
pkg = "koekeishiya/formulae/skhd"
when = { os = ["darwin"] }

[tools.bspwm]
[tools.bspwm.native]
when = { os = ["linux"], distro_family = ["arch", "debian", "fedora"] }


# --- Exact distro ID (not family) for distros with specific packages ---
[tools.ulauncher]
[tools.ulauncher.aur]
pkg = "ulauncher"
when = { distro_id = ["arch"] }

[tools.ulauncher.apt]
pkg = "ulauncher"
when = { distro_id = ["ubuntu", "debian"] }


# --- Termux renamed the CLI tool package away from the library package:
# "openssl" on Termux is the shared-library package, while the `openssl`
# *binary* (the one this schema cares about) ships in "openssl-tool". Not
# expressible via distro_family (termux is its own clan already), but shown
# here for contrast with a "normal" Linux distro where the split doesn't exist. ---
[tools.openssl]
[tools.openssl.native]
pkg_overrides = { pkg = "openssl-tool" }                                    # pkg = Termux's manager binary name
when = { distro_family = ["termux", "debian", "arch", "fedora", "alpine"] }

# ------------------------------------------------------------------------
# CASE 10 — Ecosystem buckets: python, node.
# When pkg == tool_name (~80% of Python/Node cases), use `true`
# instead of repeating the name. Buckets expand to all methods
# in the ecosystem at once.
#
#   python = true        ≡  { pip = true, pipx = true, uv = true }
#   node   = true        ≡  { npm = true, pnpm = true, bun = true }
#   python = "pkgname"   ≡  { pip = "pkgname", pipx = "pkgname", uv = "pkgname" }
#
# Three value formats:
#   true           → each method uses tool.Name as pkg
#   "string"       → each method receives the string as pkg
#   { pkg, when }  → each method receives a clone of the map
#
# Each `true` uses the tool name as pkg (SubstitutePkg fallback).
# ------------------------------------------------------------------------
[tools.ruff]
python = true # ≡ { pipx = "ruff", uv = "ruff" }
[tools.prettier]
node = true # ≡ { npm = "prettier", pnpm = "prettier", bun = "prettier" }
[tools.organize-bucket]
python = "organize-tool" # ≡ { pip = "organize-tool", pipx = "organize-tool", uv = "organize-tool" }
[tools.httpie]
python = true # pip + pipx + uv (pkg=httpie for all)

# Can mix bucket with explicit method: the explicit method is NOT overwritten.
# organize = { pip = "organize-tool", python = true } keeps the explicit pip.
[tools.DepartureMono]
post_install = { run = [
  "fc-cache",
  "-fv",
], when = { target_family = [
  "unix",
] } }
requires = ["unzip", "fontconfig"]
requires_when = { unzip = { target_family = [
  "unix",
] }, fontconfig = { target_family = [
  "unix",
] } }
method_only = [
  "aur",
  "scoop",
  "http",
] # aur on Arch, scoop on Windows, http elsewhere. Never fall back to native (no such package outside Arch).

[tools.DepartureMono.aur]
pkg = "otf-departure-mono-nerd"
when = { distro_family = ["arch"] }

[tools.DepartureMono.http]
url = "https://github.com/ryanoasis/nerd-fonts/releases/download/{latest}/DepartureMono.zip"
checksum = "sha256:e186890efcae31b72e9f2abc860360123ec1b3ae03bc79bb2a9fec388ebade8a" # literal pin (lockfile pins v3.4.0; nerd-fonts publishes no checksum file, so sha256:auto 404s)
extract_to = "~/.local/share/fonts/DepartureMono"
when = { target_family = [
  "unix",
] } # zip + $HOME fonts path + fc-cache post_install are unix-only assumptions

[tools.DepartureMono.scoop]
pkg = "nerd-fonts/DepartureMono-NF"
when = { target_family = [
  "windows",
] } # scoop extras bucket; fontconfig is Windows-incompatible


# ------------------------------------------------------------------------
# CASE 11 — Virtual tool (config-only, no installation method).
# Useful for grouping dependencies or serving as a marker for groups
# of configuration files that don't install external packages.
# ------------------------------------------------------------------------

# marina — container-based dev environment. Requires go, podman, docker-compose.
[tools.marina]
requires = ["golang", "podman", "docker-compose"]

# scripts — personal shell scripts in ~/.local/bin. No external deps.
[tools.scripts]
requires = []

# systemd — OS service manager. Part of base system, not installable.
[tools.systemd]
requires = []

# tridactyl — Firefox extension. Installed through addon store, not depengine.
[tools.tridactyl]
requires = []


# ==============================================================================
# CHECKLIST — which format to use for a new tool?
# ==============================================================================
# 1. Is the package name always the same, with no special conditions?
#       → add to the `simple` list.
#
# 2. Only the package name differs between managers (native and/or language),
#    without `when`, without multiple competing methods, fits on one line?
#       → inline table: `name = { manager = "package", ... }`
#
# 3. Needs `when`, has more than one candidate method, or the inline line
#    would be huge/unreadable?
#       → full block: [tools.NAME] + [tools.NAME.method]
#
# 4. Needs cross-platform conditions (arch + libc + os + is_container)?
#       → use `when` with multiple fields: `when = { arch = [...], os = [...], libc = [...] }`
#       → full block: [tools.NAME] + [tools.NAME.method]
#
# Fields that ALWAYS stay at the tool level (outside method):
#   requires, requires_when, dependency_only, pre_install, post_install,
#   tags, method_prefer, method_only
#
# Fields that ALWAYS stay inside the method:
#   kind, when, requires, sources, url, build, checksum, checksum_url,
#   checksum_file_format, signature_url, signing_key, extract_to, artifact,
#   binary, managed_paths, pkg, git
# ==============================================================================
