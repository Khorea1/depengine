# ==============================================================================
# schema.toml — TEMPLATE / REFERENCE
# ==============================================================================
# This file describes how to install dependencies in a distro-agnostic way.
# The engine (the program that reads this file) decides HOW to install each
# tool, trying declared methods in order until one succeeds.
#
# GOLDEN RULE: everything OMITTED = default behavior defined by the engine
# (e.g., package name = tool name, if nothing is specified).
# ==============================================================================


[defaults]
# Manager used when a tool specifies nothing (see "simple" section below).
# "native" = the user's distro native package manager
# (apt, pacman, dnf, zypper, etc — the engine detects it automatically).
manager = "native"

# AUR helper to use when any method is "aur". Only relevant on Arch-based.
aur_helper = "paru"

# When a tool declares MORE THAN ONE candidate method (e.g., cargo, go, aur, git),
# this list defines the trial order. The engine stops at the first one that works.
method_order = ["native", "scoop", "choco", "cargo", "go", "pipx", "uv", "pip", "npm", "pnpm", "bun", "gem", "yarn", "yarn-berry", "composer", "apm", "vscode", "vscodium", "flatpak", "snap", "cask", "mas", "sdkman", "steamcmd", "pacstall", "aur", "conda", "asdf", "git", "http"]


# ==============================================================================
# [tools] — ALL dependencies live inside here
# ==============================================================================
[tools]

# ------------------------------------------------------------------------
# CASE 1 — "Simple" tool: package name is the same on every relevant distro.
# No table needed, just list the name. Uses `defaults.manager`.
# ------------------------------------------------------------------------
simple = ["zsh", "zathura", "w3m", "rofi", "mpv", "kitty", "tmux", "rclone", "podman", "docker-compose", "bat", "lsd"]


# ------------------------------------------------------------------------
# CASE 2 — Package name differs by native manager.
# Format: inline table with `<manager> = "package-name-in-that-manager"`.
# Managers not listed here use the tool name itself as fallback.
# ------------------------------------------------------------------------
fd   = { apt = "fd-find" }                                   # everywhere else: "fd"
nvim = { pacman = "neovim", apt = "neovim", brew = "neovim" }
hypr = { pacman = "hyprland" }

golang = { pacman = "go", apt = "golang-go" }

# ------------------------------------------------------------------------
# CASE 3 — Language manager (pip, pipx, uv, go, cargo, npm, gem...).
# The value is the package/module name IN THAT ecosystem — it may differ
# from the final binary name.
# ------------------------------------------------------------------------
organize = { pip = "organize-tool", pipx = "organize-tool", uv = "organize-tool" }
fzf      = { go = "github.com/junegunn/fzf" }
lf       = { go = "github.com/gokcehan/lf" }


# ------------------------------------------------------------------------
# CASE 4 — cargo/go installing directly from a git repository (not from
# crates.io / pkg.go.dev official). Sub-key `git` within the manager.
aichat = { aur = { pkg = "aichat", when = { distro_family = ["arch"] } }, cargo = { git = "https://github.com/sigoden/aichat" } }
matugen    = { cargo = { git = "https://github.com/InioX/matugen" } }


# ------------------------------------------------------------------------
# CASE 5 — "git" method: clones the repo and runs a manual build command.
# Fields:
#   url   = repository to clone
#   build = command executed inside the cloned repo (always called "build",
#           never "install" — avoids naming ambiguity)
# ------------------------------------------------------------------------
ctpv = { git = { url = "https://github.com/NikitaIvanovV/ctpv", build = "make && sudo make install" } }
fasd = { git = { url = "https://github.com/clvv/fasd",        build = "PREFIX=$HOME/.local make install" } }


# ------------------------------------------------------------------------
# CASE 6 — "http" method: downloads a ready-made artifact (deb, zip, binary...).
# The checksum field accepts various algorithms and formats:
#   sha256:<hex>        → fixed SHA-256 (recommended)
#   sha256:auto         → automatic hash resolution
#   md5:<hex>, sha1:<hex>, sha512:<hex> → other algorithms
#   checksum_url        → explicit URL of the checksums file
#   checksum_file_format → "sha256sum" (default), "bsd", or "raw"
#   signature_url       → GPG verification of the checksum signature
fastfetch = { http = { url = "https://github.com/fastfetch-cli/fastfetch/releases/download/{latest}/fastfetch-linux-amd64.deb", checksum = "sha256:auto" } }

# Example with SHA-512 and explicit checksum_url:
"tool-example" = { http = { url = "https://example.com/tool-{latest}.tar.gz", checksum = "sha512:auto", checksum_url = "https://example.com/SHA512SUMS" } }

# ------------------------------------------------------------------------
# CASE 7 — Tool dependency and simultaneous package override.
# `requires` is a TOOL-LEVEL field (not method-level): it applies no matter
# which method ends up installing the tool.
# ------------------------------------------------------------------------
zathura-pdf-mupdf = { requires = ["zathura"], pacman = "zathura-pdf-mupdf" }


# ------------------------------------------------------------------------
# CASE 8 — Complex case: multiple competing methods + distro condition +
# post-install hook. This CANNOT be inlined (it would be unreadable or TOML
# does not allow line breaks inside inline tables), so we promote it to a
# full block with sub-tables.
#
# Rules for this format:
#   - [tools.NAME]              → tool-level fields: `requires`,
#                                 `postinstall` (runs after ANY method succeeds).
#   - [tools.NAME.method]       → one block per candidate method. The engine
#                                 tries them in file order (or by `method_order`,
#                                 if no explicit order is given).
#   - `when`                    → applicability condition WITHIN the method
#                                 (never its own nesting level, never becomes
#                                 a "manager" name). If the condition doesn't
#                                 match, the engine skips this method and moves
#                                 to the next.
# ------------------------------------------------------------------------

# ==============================================================================
# CASE 9 — `when` with multiple platform dimensions.
# The `when` field accepts several simultaneous conditions (AND across fields,
# OR within each list). Methods whose condition doesn't match are silently
# skipped — the engine tries the next method in order.
#
# Available dimensions:
#   distro_family → resolved family (arch, debian, fedora, alpine, ...)
#   distro_id     → exact distro ID (ubuntu, arch, fedora, ...)
#   arch          → architecture (x86_64, aarch64, armv7l, ...)
#   os            → operating system (linux, darwin, windows, ...)
#   kernel        → kernel version (uname -r)
#   libc          → C library (glibc, musl, ...) — prefix matching
#   init_system   → init system (systemd, openrc, runit, ...)
#   is_wsl        → true/false (WSL environment)
#   is_container  → true/false (container environment)
# ==============================================================================

# --- Binary differs by libc (glibc vs musl) ---
[tools.restic]
  # glibc build (Linux desktop typical)
  [tools.restic.http]
  url = "https://github.com/restic/restic/releases/download/{latest}/restic_{latest}_linux_{arch}.bz2"
  when = { arch = ["x86_64", "aarch64"], os = ["linux"], libc = ["glibc"] }

  # musl build (Alpine Linux, containers)
  [tools.restic.http-musl]
  url = "https://github.com/restic/restic/releases/download/{latest}/restic_{latest}_linux_{arch}_musl.bz2"
  when = { arch = ["x86_64", "aarch64"], os = ["linux"], libc = ["musl"] }


# --- WSL vs native Linux ---
[tools.podman]
  [tools.podman.native]
  when = { is_wsl = false }

  [tools.podman.http]
  url = "https://github.com/containers/podman/releases/download/{latest}/podman-wsl-{arch}.zip"
  when = { is_wsl = true }


# --- Container-aware: static binary inside container, native outside ---
[tools.neovim]
  [tools.neovim.native]
  when = { is_container = false }

  [tools.neovim.http]
  url = "https://github.com/neovim/neovim/releases/download/stable/nvim-linux-{arch}.tar.gz"
  extract_to = "~/.local/bin"
  when = { is_container = true, arch = ["x86_64", "aarch64"] }


# --- Kernel-specific DKMS package ---
[tools.v4l2loopback]
  [tools.v4l2loopback.aur]
  pkg = "v4l2loopback-dkms"
  when = { distro_family = ["arch"], kernel = ["6.7", "6.8", "6.9"] }


# --- macOS vs Linux: completely different platform ---
[tools.skhd]
  [tools.skhd.brew]
  pkg = "koekeishiya/formulae/skhd"
  when = { os = ["darwin"] }

[tools.bspwm]
  [tools.bspwm.native]
  when = { os = ["linux"], distro_family = ["arch", "debian", "fedora"] }


# --- Exact distro ID (not family) for distros with specific packages ---
[tools.ulauncher]
  [tools.ulauncher.aur]
  pkg = "ulauncher"
  when = { distro_id = ["arch"] }

  [tools.ulauncher.apt]
  pkg = "ulauncher"
  when = { distro_id = ["ubuntu", "debian"] }

# ------------------------------------------------------------------------
# CASE 10 — Ecosystem buckets: python, node.
# When pkg == tool_name (~80% of Python/Node cases), use `true`
# instead of repeating the name. Buckets expand to all methods
# in the ecosystem at once.
#
#   python = true        ≡  { pip = true, pipx = true, uv = true }
#   node   = true        ≡  { npm = true, pnpm = true, bun = true }
#   python = "pkgname"   ≡  { pip = "pkgname", pipx = "pkgname", uv = "pkgname" }
#
# Three value formats:
#   true           → each method uses tool.Name as pkg
#   "string"       → each method receives the string as pkg
#   { pkg, when }  → each method receives a clone of the map
#
# Each `true` uses the tool name as pkg (SubstitutePkg fallback).
# ------------------------------------------------------------------------
ruff = { python = true }               # ≡ { pipx = "ruff", uv = "ruff" }
prettier = { node = true }             # ≡ { npm = "prettier", pnpm = "prettier", bun = "prettier" }
organize = { python = "organize-tool" } # ≡ { pip = "organize-tool", pipx = "organize-tool", uv = "organize-tool" }
httpie = { python = true }             # pip + pipx + uv (pkg=httpie for all)

# Can mix bucket with explicit method: the explicit method is NOT overwritten.
# organize = { pip = "organize-tool", python = true } keeps the explicit pip.
[tools.DepartureMono]
postinstall = "fc-cache -fv"

  [tools.DepartureMono.aur]
  pkg  = "otf-departure-mono-nerd"
  when = { distro_family = ["arch"] }

  [tools.DepartureMono.http]
  url        = "https://github.com/ryanoasis/nerd-fonts/releases/download/{latest}/DepartureMono.zip"
  extract_to = "~/.local/share/fonts/DepartureMono"


# ------------------------------------------------------------------------
# CASE 11 — Virtual tool (config-only, no installation method).
# Useful for grouping dependencies or serving as a marker for groups
# of configuration files that don't install external packages.
# ------------------------------------------------------------------------

# marina — container-based dev environment. Requires go, podman, docker-compose.
[tools.marina]
requires = ["golang", "podman", "docker-compose"]

# scripts — personal shell scripts in ~/.local/bin. No external deps.
[tools.scripts]
requires = []

# systemd — OS service manager. Part of base system, not installable.
[tools.systemd]
requires = []

# tridactyl — Firefox extension. Installed through addon store, not depengine.
[tools.tridactyl]
requires = []


# ==============================================================================
# CHECKLIST — which format to use for a new tool?
# ==============================================================================
# 1. Is the package name always the same, with no special conditions?
#       → add to the `simple` list.
#
# 2. Only the package name differs between managers (native and/or language),
#    without `when`, without multiple competing methods, fits on one line?
#       → inline table: `name = { manager = "package", ... }`
#
# 3. Needs `when`, has more than one candidate method, or the inline line
#    would be huge/unreadable?
#       → full block: [tools.NAME] + [tools.NAME.method]
#
# 4. Needs cross-platform conditions (arch + libc + os + is_container)?
#       → use `when` with multiple fields: `when = { arch = [...], os = [...], libc = [...] }`
#       → full block: [tools.NAME] + [tools.NAME.method]
#
# Fields that ALWAYS stay at the tool level (outside method):
#   requires, postinstall
#
# Fields that ALWAYS stay inside the method:
#   when, url, build, checksum, checksum_url, checksum_file_format,
#   signature_url, signing_key, extract_to, pkg, git
# ==============================================================================