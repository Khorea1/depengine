# ==============================================================================
# manifest.toml — PERSONAL INSTALL CATALOG
# ==============================================================================
# This file lives at $XDG_CONFIG_HOME/depengine/manifest.toml and merges with
# any project's schema.toml. It serves two purposes:
#
#   1. Reusable knowledge base — your accumulated recipes for how to install
#      each tool (cargo vs git vs http, package name per distro, custom builds).
#      Build it once, carry it across every project.
#   2. Machine-specific overrides — when a package name differs on your distro
#      or you prefer a different method than what the project declares.
#
# Merge behavior: fields merge per-type (methods merge by kind, tags union,
# most fields schema-wins). See docs/ for the full breakdown.
#
# USAGE: copy to ~/.config/depengine/manifest.toml and edit.
# ==============================================================================
#
# ⚠ NOTE: This file is an ILLUSTRATIVE EXAMPLE. Several tools below include
# fields (pre_install, postinstall, requires, method_order) that the validator
# REJECTS in a real manifest — they only work in the project's schema.toml.
# When copying to ~/.config/depengine/manifest.toml, remove or comment out
# these fields. See docs/ for details.

# ==============================================================================
# [packages] — installation knowledge
# ==============================================================================
# Same grammar as schema.toml: `simple = [...]`, inline tables, blocks.
# The difference: only NON-TRIVIAL knowledge goes here (package names that differ
# by distro, or use non-native methods). Tools whose name is the same everywhere
# do NOT need to be here.
#
# ATTRIBUTES AVAILABLE PER METHOD:
#
#   git:   url, build, branch, depth, binary, checksum, signature_url
#   http:  url, checksum, checksum_url, checksum_file_format, signature_url,
#          signing_key, extract_to, binary
#   native/aur/cargo/go/pip/pipx/uv/npm/bun/pnpm/gem:
#          pkg, git (for cargo/go install --git), when
#
#   Tool-level: requires, pre_install (or preinstall), postinstall, tags
#   Conditional: when = { distro_family = [...] }
# ==============================================================================
[packages]

# ==============================================================================
# SECTION 1 — Native + language managers combined
# ==============================================================================
# Each tool appears ONCE. Native managers (pacman, apt, brew) and language
# managers (cargo, go, pipx, npm…) coexist in the same inline table — the engine
# tries one at a time following method_order.
#
# When the binary name differs from the native manager's package name, we declare
# the override; for undeclared managers, the tool name is used as fallback.
# ==============================================================================

# --- native + multi-ecosystem ---
nvim      = { pacman = "neovim",             apt = "neovim",                brew = "neovim" }
fd        = { apt = "fd-find",               cargo = "fd-find" }
go        = { pacman = "go",                 apt = "golang-go" }
rg        = { pacman = "ripgrep",            apt = "ripgrep" }
btop      = { pacman = "btop",               apt = "btop" }
eza       = { pacman = "eza",                apt = "eza" }
delta     = { pacman = "git-delta",          apt = "git-delta",             brew = "git-delta",     cargo = "git-delta" }
tealdeer  = { pacman = "tealdeer",           apt = "tealdeer",                                           cargo = "tealdeer" }
helix     = { pacman = "helix",              apt = "helix",                                              cargo = "helix" }
zellij    = { pacman = "zellij",             apt = "zellij",                                             cargo = "zellij" }
sesh      = { pacman = "sesh",               apt = "sesh" }
yazi      = { pacman = "yazi",               apt = "yazi" }
dust      = { pacman = "dust",               apt = "du-dust",                                           cargo = "du-dust" }
procs     = { pacman = "procs",              apt = "procs",                                             cargo = "procs" }
doggo     = { pacman = "doggo",              apt = "doggo" }
hx        = { pacman = "helix",              apt = "helix" }      # alias for helix
lazygit   = { pacman = "lazygit",            brew = "lazygit",                                          go = "github.com/jesseduffield/lazygit" }

# --- pip / pipx / uv (Python) — with ``python = true`` bucket ---
# When pkg == tool_name, no need to repeat: ``ruff = { python = true }``
# expands to ``{ pip = true, pipx = true, uv = true }``.
organize      = { pip = "organize-tool", pipx = "organize-tool", uv = "organize-tool" }   # organize-tool ≠ organize
httpie        = { python = true }
poetry        = { python = true }
ruff          = { python = true }
uv            = { python = true }
shell-gpt     = { python = true }
youtube-dl    = { python = true }
yt-dlp        = { python = true }
tldr          = { python = true }
mitmproxy     = { python = true }
ansible       = { python = true }
ansible-lint  = { python = true }
pre-commit    = { python = true }
cookiecutter  = { python = true }

# --- go install ---
fzf           = { go = "github.com/junegunn/fzf" }
lf            = { go = "github.com/gokcehan/lf" }
lazydocker    = { go = "github.com/jesseduffield/lazydocker" }
jj            = { go = "github.com/josharian/jj" }              # interactive git log
micro         = { go = "github.com/zyedidia/micro/v2" }
cheat         = { go = "github.com/cheat/cheat/cmd/cheat" }
syncthing     = { go = "github.com/syncthing/syncthing" }
restic        = { go = "github.com/restic/restic/cmd/restic" }
hugo          = { go = "github.com/gohugoio/hugo" }
termscp       = { go = "github.com/veeso/termscp" }
gotop         = { go = "github.com/xxxserxxx/gotop/v4" }
croc          = { go = "github.com/schollz/croc" }

# --- cargo (Rust) ---
starship      = { cargo = "starship" }
bat           = { cargo = "bat" }
sd            = { cargo = "sd" }
lsd           = { cargo = "lsd" }
bottom        = { cargo = "bottom" }
bandwhich     = { cargo = "bandwhich" }
cargo-binstall = { cargo = "cargo-binstall" }
cargo-update  = { cargo = "cargo-update" }
cargo-audit   = { cargo = "cargo-audit" }
mcfly         = { cargo = "mcfly" }
atuin         = { cargo = "atuin" }
ripgrep-all   = { cargo = "ripgrep_all" }
xh            = { cargo = "xh" }
bacon         = { cargo = "bacon" }           # code review tool
kanata        = { cargo = "kanata" }
hyperfine     = { cargo = "hyperfine" }
dog           = { cargo = "dog" }
warp          = { cargo = "warp" }
grex          = { cargo = "grex" }
difftastic    = { cargo = "difftastic" }
just          = { cargo = "just",             pacman = "just",               apt = "just" }
fnm           = { cargo = "fnm" }
zoxide        = { cargo = "zoxide",           pacman = "zoxide",             apt = "zoxide" }
wasm-pack     = { cargo = "wasm-pack" }
tailspin      = { cargo = "tailspin" }
tokei         = { cargo = "tokei" }
onefetch      = { cargo = "onefetch" }
pastel        = { cargo = "pastel" }
hexyl         = { cargo = "hexyl" }
ouch          = { cargo = "ouch" }
fclones       = { cargo = "fclones" }

# --- cargo install --git (directly from repository, not crates.io) ---
aichat        = { cargo = { git = "https://github.com/sigoden/aichat" } }
matugen       = { cargo = { git = "https://github.com/InioX/matugen" } }
nh            = { cargo = { git = "https://github.com/not-an-aardvark/nh" } }   # node --run helper

# --- npm / pnpm / bun (Node.js) — with ``node = true`` bucket ---
# ``node = true`` expands to ``{ npm = true, pnpm = true, bun = true }``.
# Explicit method before the bucket is not overwritten.
neovim        = { node = true }
markdownlint  = { npm = "markdownlint-cli" }       # markdownlint-cli ≠ markdownlint
prettier      = { node = true }
eslint        = { node = true }
typescript    = { node = true }
tsx           = { node = true }
oxlint        = { node = true }
bun           = { node = true }

# --- gem (Ruby) ---
jekyll        = { gem = "jekyll" }
rails         = { gem = "rails" }
sass          = { gem = "sass" }

# --- conda / flatpak / snap ---
jupyter       = { conda = "jupyter" }
obsidian      = { flatpak = "md.obsidian.Obsidian",  snap = "obsidian" }
spotify       = { flatpak = "com.spotify.Client",    snap = "spotify" }
slack         = { flatpak = "com.slack.Slack" }

# ==============================================================================
# SECTION 2 — Installation via git (clone + manual build)
# ==============================================================================
# The engine clones the repository and runs `build` inside it.
# Attributes: url (required), build, branch, depth (default 1), binary, checksum
# ==============================================================================

ctpv = { git = { url = "https://github.com/NikitaIvanovV/ctpv", build = "make && sudo make install" } }
fasd = { git = { url = "https://github.com/clvv/fasd",          build = "PREFIX=$HOME/.local make install" } }

# With specific branch and full clone (depth = 0)
neovim-git = { git = { url = "https://github.com/neovim/neovim", branch = "master", depth = 0, build = "make CMAKE_BUILD_TYPE=Release && sudo make install" } }

# With binary field (checks if ~/.local/bin/lf exists after build)
lf-source   = { git = { url = "https://github.com/gokcehan/lf",  build = "go build -o $HOME/.local/bin/lf", binary = "lf" } }

# Clone only (plugin manager)
tpm         = { git = { url = "https://github.com/tmux-plugins/tpm", depth = 1 } }

# ==============================================================================
# SECTION 3 — Installation via http (release binary / deb / archive)
# ==============================================================================
# Downloads a ready-made artifact. Supports {latest} placeholder,
# checksum, checksum_url, signature_url, extract_to.
# ==============================================================================


[packages.fastfetch]
  [packages.fastfetch.http]
  url      = "https://github.com/fastfetch-cli/fastfetch/releases/download/{latest}/fastfetch-linux-amd64.deb"
  checksum = "sha256:auto"


# With explicit checksum_url and sha256sum format
[packages.lazygit-bin]
  [packages.lazygit-bin.http]
  url                  = "https://github.com/jesseduffield/lazygit/releases/download/{latest}/lazygit_{latest}_Linux_x86_64.tar.gz"
  checksum             = "sha256:auto"
  checksum_url         = "https://github.com/jesseduffield/lazygit/releases/download/{latest}/checksums.txt"
  checksum_file_format = "sha256sum"
  extract_to           = "~/.local/bin"


# GPG signature + single binary extraction
[packages.age]
  [packages.age.http]
  url           = "https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz"
  checksum      = "sha256:auto"
  signature_url = "https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz.asc"
  signing_key   = "https://github.com/FiloSottile/age.keys"
  extract_to    = "~/.local/bin"


# Binary extracted with binary field
[packages.gh]
  [packages.gh.http]
  url        = "https://github.com/cli/cli/releases/download/{latest}/gh_{latest}_linux_amd64.tar.gz"
  checksum   = "sha256:auto"
  extract_to = "~/.local/bin"
  binary     = "gh"


# Fonts in zip with direct extraction to fonts directory
[packages.JetBrainsMono]
  [packages.JetBrainsMono.http]
  url        = "https://github.com/ryanoasis/nerd-fonts/releases/download/{latest}/JetBrainsMono.zip"
  checksum   = "sha256:auto"
  extract_to = "~/.local/share/fonts/JetBrainsMono"


[packages.FiraCode]
  [packages.FiraCode.http]
  url        = "https://github.com/ryanoasis/nerd-fonts/releases/download/{latest}/FiraCode.zip"
  checksum   = "sha256:auto"
  extract_to = "~/.local/share/fonts/FiraCode"


# Direct .deb file
[packages.slack-deb]
  [packages.slack-deb.http]
  url      = "https://downloads.slack-edge.com/desktop-releases/linux/{latest}/slack-desktop-{latest}-amd64.deb"
  checksum = "sha256:auto"

# ==============================================================================
# SECTION 4 — Full block with conditional method + hooks
# ==============================================================================
# Use block format when a tool needs:
#   - Multiple competing methods with different conditions
#   - Hooks pre_install / postinstall
#   - Tags for profile filtering
#   - requires (dependencies between tools)
# ==============================================================================

# --- DepartureMono Nerd Font: AUR on Arch, HTTP everywhere else ---
[packages.DepartureMono]
tags = ["fonts"]
# postinstall runs after ANY method succeeds
postinstall = "fc-cache -fv"

  [packages.DepartureMono.aur]
  pkg  = "otf-departure-mono-nerd"
  when = { distro_family = ["arch"] }

  [packages.DepartureMono.http]
  url        = "https://github.com/ryanoasis/nerd-fonts/releases/download/{latest}/DepartureMono.zip"
  checksum   = "sha256:auto"
  extract_to = "~/.local/share/fonts/DepartureMono"


# --- wezterm: AUR → AppImage → manual compilation (fallback) ---
[packages.wezterm]
tags = ["terminal"]

  [packages.wezterm.aur]
  pkg  = "wezterm"
  when = { distro_family = ["arch"] }

  [packages.wezterm.http]
  url        = "https://github.com/wez/wezterm/releases/download/{latest}/WezTerm-{latest}-Ubuntu20.04.AppImage"
  checksum   = "sha256:auto"
  extract_to = "~/.local/bin"
  binary     = "wezterm"

  [packages.wezterm.git]
  url   = "https://github.com/wez/wezterm"
  depth = 1
  build = "cargo build --release && cp target/release/wezterm ~/.local/bin/"


# --- ripgrep-all (rga): cargo → http (fallback) ---
[packages.rga]
requires = ["ripgrep"]
tags     = ["search"]

  [packages.rga.cargo]
  pkg = "ripgrep_all"

  [packages.rga.http]
  url      = "https://github.com/phiresky/ripgrep-all/releases/download/{latest}/ripgrep_all-v{latest}-x86_64-unknown-linux-musl.tar.gz"
  checksum = "sha256:auto"
  extract_to = "~/.local/bin"
  binary     = "rga"


# --- Docker: native → get.docker.com script (fallback) ---
[packages.docker]
tags = ["containers"]

  [packages.docker.native]
  pkg  = "docker"
  when = { distro_family = ["arch", "debian", "ubuntu", "fedora"] }

  [packages.docker.http]
  url    = "https://get.docker.com"
  build  = "sh get-docker.sh"


# --- Lua Language Server: AUR → pre-compiled binary ---
[packages.lua-language-server]
tags = ["lsp", "dev"]

  [packages.lua-language-server.aur]
  pkg  = "lua-language-server"
  when = { distro_family = ["arch"] }

  [packages.lua-language-server.http]
  url      = "https://github.com/LuaLS/lua-language-server/releases/download/{latest}/lua-language-server-{latest}-linux-x64.tar.gz"
  checksum = "sha256:auto"
  extract_to = "~/.local/bin"
  binary     = "lua-language-server"


# --- mise: cargo → curl|sh (fallback) with pre_install hook ---
[packages.mise]
tags = ["dev", "runtimes"]
pre_install  = "which curl >/dev/null || (apt-get update && apt-get install -y curl)"
postinstall  = "mise help >/dev/null"

  [packages.mise.cargo]
  pkg = "mise"

  [packages.mise.http]
  url    = "https://mise.run"
  build  = "sh mise.sh"


# --- shellcheck: native → cargo → pre-compiled binary ---
[packages.shellcheck]
tags = ["lint", "dev"]

  [packages.shellcheck.native]
  pkg  = "shellcheck"
  when = { distro_family = ["arch", "debian", "ubuntu", "fedora"] }

  [packages.shellcheck.cargo]
  pkg = "shellcheck"

  [packages.shellcheck.http]
  url      = "https://github.com/koalaman/shellcheck/releases/download/{latest}/shellcheck-{latest}.linux.x86_64.tar.xz"
  checksum = "sha256:auto"
  extract_to = "~/.local/bin"
  binary     = "shellcheck"


# --- shfmt: native → go → http ---
[packages.shfmt]
tags = ["lint", "dev"]

  [packages.shfmt.native]
  pkg  = "shfmt"
  when = { distro_family = ["arch", "debian", "ubuntu", "fedora"] }

  [packages.shfmt.go]
  pkg = "mvdan.cc/sh/v3/cmd/shfmt"

  [packages.shfmt.http]
  url      = "https://github.com/mvdan/sh/releases/download/{latest}/shfmt_{latest}_linux_amd64"
  checksum = "sha256:auto"
  extract_to = "~/.local/bin"
  binary     = "shfmt"


# --- hadolint (Dockerfile linter): native → http ---
[packages.hadolint]
tags = ["lint", "containers"]

  [packages.hadolint.native]
  pkg  = "hadolint"
  when = { distro_family = ["arch"] }

  [packages.hadolint.http]
  url      = "https://github.com/hadolint/hadolint/releases/download/{latest}/hadolint-Linux-x86_64"
  checksum = "sha256:auto"
  extract_to = "~/.local/bin"
  binary     = "hadolint"


# ==============================================================================
# SECTION 5 — Tools with exclusive distribution (AUR / conda / etc.)
# ==============================================================================
# The engine skips methods whose when does not match the current environment.
# ==============================================================================

[packages.paru]
tags = ["aur-helper"]

  [packages.paru.aur]
  pkg  = "paru"
  when = { distro_family = ["arch"] }

  [packages.paru.git]
  url   = "https://github.com/Morganamilo/paru"
  build = "makepkg -si"
  when  = { distro_family = ["arch"] }


[packages.yay]
tags = ["aur-helper"]

  [packages.yay.aur]
  pkg  = "yay-bin"
  when = { distro_family = ["arch"] }


# ==============================================================================
# CHECKLIST — which format to use for a new package in the manifest?
# ==============================================================================
# 1. Only the package name differs between native managers?
#       → inline table: `name = { pacman = "...", apt = "...", brew = "..." }`
#
# 2. Uses a language manager (cargo, go, pipx, npm...) without a condition?
#       → inline table: `name = { cargo = "name-of-crate" }`
#
# 3. Needs when, hooks (pre_install/postinstall), tags, requires,
#    or multiple competing methods?
#       → full block: [packages.NAME] + [packages.NAME.method]
#
# Fields that ALWAYS stay at the package level (outside method):
#   requires, pre_install, postinstall, tags
#
# Fields that ALWAYS stay inside the method:
#   kind, when, pkg, url, build, branch, depth, checksum, checksum_url,
#   checksum_file_format, signature_url, signing_key, extract_to,
#   binary, git
# ==============================================================================